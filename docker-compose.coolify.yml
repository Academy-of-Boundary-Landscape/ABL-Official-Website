services:
  postgres:
    image: postgres@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-strapi}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD is required}
      POSTGRES_DB: ${PG_DB:-strapi_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 12
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  strapi:
    build: ./strapi-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '1337'
      URL: https://api.abl.secret-sealing.club
      APP_KEYS: ${APP_KEYS:?APP_KEYS is required}
      API_TOKEN_SALT: ${API_TOKEN_SALT:?API_TOKEN_SALT is required}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?ADMIN_JWT_SECRET is required}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT:?TRANSFER_TOKEN_SALT is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      STRAPI_TELEMETRY_DISABLED: 'true'
      DATABASE_CLIENT: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: '5432'
      DATABASE_NAME: ${PG_DB:-strapi_db}
      DATABASE_USERNAME: ${PG_USER:-strapi}
      DATABASE_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD is required}
      DATABASE_SSL: 'false'
    volumes:
      - ${ABL_UPLOADS_PATH:-/home/deploy/abl_website/strapi-backend/public/uploads}:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:1337/_health').then(r=>process.exit(r.status===204?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging: *logging

  frontend:
    build:
      context: ./frontend
      args:
        NGINX_CONFIG: nginx.coolify.conf
    restart: unless-stopped
    volumes:
      - ${ABL_UPLOADS_PATH:-/home/deploy/abl_website/strapi-backend/public/uploads}:/srv/uploads:ro
    depends_on:
      strapi:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1/healthz']
      interval: 10s
      timeout: 3s
      retries: 6
    logging: *logging

volumes:
  pgdata:
    external: true
    name: ${ABL_PG_VOLUME:-abl_website_pgdata}
