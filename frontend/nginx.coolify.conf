set_real_ip_from coolify-proxy;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# TLS and HTTP redirects are managed by Coolify/Traefik.
map $http_x_forwarded_proto $origin_scheme {
    default $scheme;
    https https;
}
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80 default_server;
    server_name abl.secret-sealing.club www.abl.secret-sealing.club able.secret-sealing.club www.able.secret-sealing.club;
    root /usr/share/nginx/html;
    index index.html;
    location = /healthz { access_log off; return 200 'ok'; }
    location / { try_files $uri $uri/ /index.html; }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
server {
    listen 80;
    server_name api.abl.secret-sealing.club;
    client_max_body_size 100M;
    location /uploads/ {
        alias /srv/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header Access-Control-Allow-Origin "https://abl.secret-sealing.club" always;
    }
    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $strapi_upstream strapi:1337;
        proxy_pass http://$strapi_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $origin_scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
