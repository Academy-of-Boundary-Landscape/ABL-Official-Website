services:
  postgres:
    image: postgres:16-alpine
    container_name: abl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-strapi}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?PG_PASSWORD must be set}
      POSTGRES_DB: ${PG_DB:-strapi_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Exposed to host so Strapi (running directly on host) can connect
      # Host 5432 is already taken by system postgres — use 5433
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-strapi}"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build: ./frontend
    container_name: abl-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
